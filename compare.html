<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare courses · UPSY Courses</title>
  <link rel="icon" href="upsy_logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><img src="upsy_logo.jpeg" alt="UPSY" /><span>UPSY</span><small>Courses</small></a>
      <nav class="nav">
        <a href="index.html">Courses</a>
        <a href="colleges.html">Colleges</a>
        <a href="compare.html">Compare</a>
      </nav>
    </div>
  </header>
  <div class="sample-banner">Preview with sample data. Fees and figures are placeholders until the UPSY catalogue is loaded.</div>

  <div class="container page-title">
    <h1>Compare courses</h1>
    <p>Pick up to three courses from the listing. Best value in each row is highlighted.</p>
  </div>
  <main class="container compare-wrap" id="wrap"></main>

  <footer class="site-footer"><div class="container"><span>UPSY Courses · a product of UPSY</span><span>Sample catalogue</span></div></footer>

  <script type="module">
    import { loadData, money, moneyFull, years, esc, compareIds, removeCompare, markNav } from "./app.js";
    const db = await loadData();
    markNav();
    const wrap = document.getElementById("wrap");

    function render() {
      const list = compareIds().map((id) => db.courses.find((c) => c.id === id)).filter(Boolean);
      if (list.length < 1) {
        wrap.innerHTML = `<div class="empty">Nothing to compare yet. <a href="index.html" style="color:var(--primary);font-weight:700">Browse courses</a> and press “+ Compare” on two or three of them.</div>`;
        return;
      }
      const lowest = (f) => Math.min(...list.map(f));
      const highest = (f) => Math.max(...list.map(f));
      const rows = [
        ["College", (c) => `${esc(c.college.fullName)}<br><small style="color:var(--muted)">${esc(c.college.city)}, ${esc(c.college.state)} · ${esc(c.college.type)}</small>`],
        ["Level", (c) => `${esc(c.level)} · ${esc(c.degree)}`],
        ["Stream", (c) => esc(c.stream) + " · " + esc(c.specialisation)],
        ["Total fee", (c) => moneyFull(c.totalFee), (c) => c.totalFee === lowest((x) => x.totalFee)],
        ["Fee per year", (c) => money(Math.round(c.totalFee / c.durationYears)), (c) => Math.round(c.totalFee / c.durationYears) === lowest((x) => Math.round(x.totalFee / x.durationYears))],
        ["Duration", (c) => years(c.durationYears), (c) => c.durationYears === lowest((x) => x.durationYears)],
        ["Terms", (c) => String(c.semesters)],
        ["Mode", (c) => esc(c.mode)],
        ["Intake", (c) => esc(c.intake)],
        ["Seats", (c) => c.seats.toLocaleString("en-IN")],
        ["Eligibility", (c) => esc(c.eligibility)],
        ["Entrance exam", (c) => esc(c.entrance)],
        ["Average package", (c) => esc(c.avgPackage)],
        ["Rating", (c) => `&#9733; ${c.rating.toFixed(1)} (${c.reviews.toLocaleString("en-IN")})`, (c) => c.rating === highest((x) => x.rating)],
        ["NIRF rank", (c) => (c.college.nirf ? `#${c.college.nirf}` : "-"), (c) => c.college.nirf && c.college.nirf === lowest((x) => x.college.nirf || 999)],
        ["NAAC grade", (c) => esc(c.college.naac)],
        ["Skills", (c) => c.skills.map(esc).join(", ")],
      ];
      wrap.innerHTML = `
        <table class="compare">
          <thead><tr><th></th>${list.map((c) => `<th><small>${esc(c.college.name)}</small><a href="course.html?id=${encodeURIComponent(c.id)}">${esc(c.name)}</a><button type="button" class="remove" data-id="${esc(c.id)}">Remove</button></th>`).join("")}</tr></thead>
          <tbody>${rows.map(([label, cell, best]) => `<tr><th>${label}</th>${list.map((c) => `<td class="${best && list.length > 1 && best(c) ? "best" : ""}">${cell(c)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>`;
      wrap.querySelectorAll(".remove").forEach((b) => b.addEventListener("click", () => { removeCompare(b.dataset.id); render(); }));
    }
    render();
  </script>
</body>
</html>
