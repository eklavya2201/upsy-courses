<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course · UPSY Courses</title>
  <link rel="icon" href="upsy_logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><img src="upsy_logo.jpeg" alt="UPSY" /><span>UPSY</span><small>Courses</small></a>
      <nav class="nav">
        <a class="topic" href="index.html#search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Try a new topic</span><kbd>Ctrl+K</kbd></a>
        <a href="saved.html">Saved<span class="pill" data-saved-count hidden>0</span></a>
      </nav>
    </div>
  </header>

  <main class="container shell">
    <aside class="assistant" id="assistant"></aside>
    <section class="course-pane" id="pane"><div class="skeleton"></div></section>
  </main>
  <button type="button" class="assistant-fab" id="fab">✦ Ask UPSY</button>
  <div class="scrim" id="scrim"></div>

  <script type="module">
    import { loadData, esc, param, num, duration, stars, savedIds, toggleSaved, updateSavedCount, wireSaveButtons, markNav, mountAssistant, openAssistant, closeAssistant } from "./app.js";
    const db = await loadData();
    markNav();
    const $ = (s) => document.querySelector(s);
    const c = db.courses.find((x) => x.id === param("id"));
    if (!c) {
      $("#pane").innerHTML = `<h1>Course not found</h1><p><a href="index.html" style="color:var(--primary)">Back to search</a></p>`;
    } else {
      document.title = `${c.title} · UPSY Courses`;
      const saved = savedIds().includes(c.id);
      $("#pane").innerHTML = `
        <h1>${esc(c.title)}</h1>
        <div class="sub">${c.institution ? `<b>${esc(c.institution)}</b> · ` : ""}${esc(c.provider)}</div>
        ${c.rating != null ? `<div class="sub"><span class="stars">${stars(c.rating)}</span> ${c.rating.toFixed(1)} <span class="muted">(${num(c.numRatings)})</span></div>` : ""}
        <div class="chiprow">
          <span class="tag type">${esc(c.type)}</span><span class="tag">${esc(c.level)}</span>
          ${c.selfPaced ? `<span class="tag">Self-paced</span>` : ""}${c.free ? `<span class="tag free">Free</span>` : ""}${c.certificate ? `<span class="tag">Certificate</span>` : ""}
          <span class="tag">${esc(duration(c))}</span><span class="tag">${esc(c.language)}</span>
        </div>
        <div class="enroll">
          <a class="btn primary" href="${esc(c.url)}" target="_blank" rel="noopener">Enroll on ${esc(c.provider)} ↗</a>
          <button type="button" class="save${saved ? " on" : ""}" data-save="${esc(c.id)}" aria-label="Save course"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button>
        </div>
        <p class="fine">You'll be taken to ${esc(c.provider)}'s website.</p>
        <section class="section">
          <h2>What you'll learn</h2>
          <p>${esc(c.summary)}</p>
          <p class="muted" style="font-size:12px">Summary as published by the source catalogue.</p>
        </section>
        <section class="section">
          <h2>Skills you'll gain</h2>
          <div class="skills">${c.skills.map((s) => `<span class="skill">${esc(s)}</span>`).join("")}</div>
        </section>
        ${c.careers?.length ? `<section class="section">
          <h2>Where this takes you <span class="tag">O*NET / BLS</span></h2>
          ${c.careers.map((k) => `<div class="career"><b>${esc(k.title)}</b><span>${esc(k.salary)}</span></div>`).join("")}
          <p class="muted" style="font-size:12px">US salary ranges from the source catalogue. For information only.</p>
        </section>` : ""}
        <section class="section">
          <h2>Key facts</h2>
          <dl class="kv">
            <dt>Provider</dt><dd>${esc(c.provider)}</dd>
            ${c.institution ? `<dt>Institution</dt><dd>${esc(c.institution)}</dd>` : ""}
            <dt>Resource type</dt><dd>${esc(c.type)}</dd>
            <dt>Level</dt><dd>${esc(c.level)}</dd>
            <dt>Pace</dt><dd>${c.selfPaced ? "Self-paced" : "Scheduled"}</dd>
            <dt>Duration</dt><dd>${esc(duration(c))}</dd>
            <dt>Language</dt><dd>${esc(c.language)}</dd>
            <dt>Subject</dt><dd><a href="search.html?q=${encodeURIComponent(c.subject)}" style="color:var(--primary)">${esc(c.subject)}</a></dd>
          </dl>
        </section>`;
      wireSaveButtons($("#pane"));

      mountAssistant($("#assistant"), {
        db,
        opening: "Curious if this is the right fit for you? I can help break it down. Just ask.",
        chips: ["Is this right for someone with my background?", "How long will this realistically take?", "What could I do after completing this?", "Help me plan my learning"],
        context: () => ({ courseId: c.id }),
        onResults: null,
      });
      $("#fab").addEventListener("click", () => openAssistant($("#assistant")));
      $("#scrim").addEventListener("click", () => closeAssistant($("#assistant")));
    }
  </script>
</body>
</html>
