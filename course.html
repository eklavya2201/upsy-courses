<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Course · UPSY Courses</title>
  <link rel="icon" href="upsy_logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><img src="upsy_logo.jpeg" alt="UPSY" /><span>UPSY</span><small>Courses</small></a>
      <nav class="nav">
        <a href="index.html">Courses</a>
        <a href="colleges.html">Colleges</a>
        <a href="compare.html">Compare</a>
      </nav>
    </div>
  </header>
  <div class="sample-banner">Preview with sample data. Fees and figures are placeholders until the UPSY catalogue is loaded.</div>

  <section class="detail-hero"><div class="container" id="hero"></div></section>
  <main class="container detail">
    <div id="main"></div>
    <aside class="side" id="side"></aside>
  </main>

  <footer class="site-footer"><div class="container"><span>UPSY Courses · a product of UPSY</span><span>Sample catalogue</span></div></footer>

  <script type="module">
    import { loadData, money, moneyFull, years, esc, param, courseCard, wireCompareButtons, renderTray, compareIds, toggleCompare, markNav } from "./app.js";
    const db = await loadData();
    markNav();
    renderTray(db);
    const $ = (s) => document.querySelector(s);
    const c = db.courses.find((x) => x.id === param("id"));
    if (!c) {
      $("#hero").innerHTML = `<h1>Course not found</h1><p class="sub"><a href="index.html">Back to all courses</a></p>`;
    } else {
      document.title = `${c.name} at ${c.college.name} · UPSY Courses`;
      const col = c.college;
      $("#hero").innerHTML = `
        <div class="crumbs"><a href="index.html">Courses</a> › <a href="index.html?q=${encodeURIComponent(c.stream)}">${esc(c.stream)}</a> › ${esc(c.degree)}</div>
        <h1>${esc(c.name)}</h1>
        <div class="sub"><a href="colleges.html#${esc(col.id)}">${esc(col.fullName)}</a> · ${esc(col.city)}, ${esc(col.state)} · ${esc(col.type)}</div>
        <div class="stats">
          <div class="stat"><small>Total fee</small><b>${money(c.totalFee)}</b></div>
          <div class="stat"><small>Duration</small><b>${years(c.durationYears)}</b></div>
          <div class="stat"><small>Level</small><b>${esc(c.level)} · ${esc(c.degree)}</b></div>
          <div class="stat"><small>Entrance</small><b>${esc(c.entrance)}</b></div>
          <div class="stat"><small>Rating</small><b>&#9733; ${c.rating.toFixed(1)} <span style="font-weight:500;color:var(--muted);font-size:13px">(${c.reviews.toLocaleString("en-IN")})</span></b></div>
          ${col.nirf ? `<div class="stat"><small>NIRF rank</small><b>#${col.nirf}</b></div>` : ""}
        </div>`;

      const perYear = Math.round(c.totalFee / c.durationYears);
      const perSem = Math.round(c.totalFee / c.semesters);
      $("#main").innerHTML = `
        <section class="panel">
          <h2>About the course</h2>
          <p>${esc(c.summary)}</p>
          <div class="tags">${c.skills.map((s) => `<span class="tag">${esc(s)}</span>`).join("")}</div>
        </section>
        <section class="panel">
          <h2>Key facts</h2>
          <dl class="kv">
            <dt>Degree</dt><dd>${esc(c.degree)} (${esc(c.level)})</dd>
            <dt>Specialisation</dt><dd>${esc(c.specialisation)}</dd>
            <dt>Stream</dt><dd>${esc(c.stream)}</dd>
            <dt>Mode</dt><dd>${esc(c.mode)}</dd>
            <dt>Duration</dt><dd>${years(c.durationYears)} · ${c.semesters} ${c.semesters === 1 ? "term" : "terms"}</dd>
            <dt>Intake</dt><dd>${esc(c.intake)}</dd>
            <dt>Seats</dt><dd>${c.seats.toLocaleString("en-IN")}</dd>
            <dt>Eligibility</dt><dd>${esc(c.eligibility)}</dd>
            <dt>Entrance exam</dt><dd>${esc(c.entrance)}</dd>
            <dt>Average package</dt><dd>${esc(c.avgPackage)}</dd>
          </dl>
        </section>
        <section class="panel">
          <h2>Fees</h2>
          <table class="fee-table">
            <thead><tr><th>Item</th><th>Amount</th></tr></thead>
            <tbody>
              <tr><td>Total programme fee</td><td>${moneyFull(c.totalFee)}</td></tr>
              <tr><td>Per year (${c.durationYears} years)</td><td>${moneyFull(perYear)}</td></tr>
              <tr><td>Per term (${c.semesters} terms)</td><td>${moneyFull(perSem)}</td></tr>
            </tbody>
          </table>
          <p style="margin-top:10px;font-size:13px;color:var(--muted)">Tuition only, as listed. Hostel, mess and exam fees are not included.</p>
        </section>
        <section class="panel">
          <h2>About ${esc(col.name)}</h2>
          <p>${esc(col.about)}</p>
          <dl class="kv">
            <dt>Full name</dt><dd>${esc(col.fullName)}</dd>
            <dt>Type</dt><dd>${esc(col.type)}</dd>
            <dt>Established</dt><dd>${col.established}</dd>
            <dt>NAAC grade</dt><dd>${esc(col.naac)}</dd>
            <dt>Campus</dt><dd>${esc(col.campus)}</dd>
          </dl>
        </section>`;

      const inCompare = compareIds().includes(c.id);
      const similar = db.courses.filter((x) => x.id !== c.id && (x.stream === c.stream || x.collegeId === c.collegeId)).sort((a, b) => (a.collegeId === c.collegeId ? -1 : 0) + b.rating - a.rating).slice(0, 5);
      $("#side").innerHTML = `
        <div class="panel">
          <button type="button" class="btn ${inCompare ? "ghost on" : "primary"}" id="cmp">${inCompare ? "Added to compare" : "+ Add to compare"}</button>
          <a class="btn ghost" href="index.html?college=${encodeURIComponent(col.id)}">All courses at ${esc(col.name)}</a>
          <a class="btn ghost" href="index.html?q=${encodeURIComponent(c.degree)}">Other ${esc(c.degree)} courses</a>
        </div>
        <div class="panel">
          <h2>Similar courses</h2>
          <div class="mini">${similar.map((s) => `<a href="course.html?id=${encodeURIComponent(s.id)}">${esc(s.name)}<small>${esc(s.college.name)} · ${money(s.totalFee)} · ${years(s.durationYears)}</small></a>`).join("")}</div>
        </div>`;
      $("#cmp").addEventListener("click", () => {
        const r = toggleCompare(c.id);
        if (r.full) { $("#cmp").textContent = "Compare list is full (3)"; return; }
        const on = r.ids.includes(c.id);
        $("#cmp").className = `btn ${on ? "ghost on" : "primary"}`;
        $("#cmp").textContent = on ? "Added to compare" : "+ Add to compare";
        renderTray(db);
      });
    }
  </script>
</body>
</html>
