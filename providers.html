<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Providers · UPSY Courses</title>
  <link rel="icon" href="upsy_logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><img src="upsy_logo.jpeg" alt="UPSY" /><span>UPSY</span><small>Courses</small></a>
      <nav class="nav">
        <a href="index.html">Courses</a>
        <a href="providers.html">Providers</a>
        <a href="compare.html">Compare</a>
      </nav>
    </div>
  </header>
  <div class="sample-banner">Preview: 11 courses scraped from coursecorrect.fyi on 1 Oct 2026. The real UPSY catalogue replaces this file.</div>

  <div class="container page-title">
    <h1>Providers</h1>
    <p>Every platform in the catalogue, with the institutions behind its courses.</p>
  </div>
  <main class="container" style="padding-bottom:90px">
    <div class="grid" id="grid"></div>
  </main>

  <footer class="site-footer"><div class="container"><span>UPSY Courses · a product of UPSY</span><span>Preview catalogue</span></div></footer>

  <script type="module">
    import { loadData, esc, num, duration, renderTray, markNav } from "./app.js";
    const db = await loadData();
    markNav();
    renderTray(db);
    const by = {};
    db.courses.forEach((c) => (by[c.provider] ||= []).push(c));
    document.getElementById("grid").innerHTML = Object.entries(by).sort((a, b) => b[1].length - a[1].length).map(([p, list]) => {
      const rated = list.filter((c) => c.rating != null);
      const avg = rated.length ? (rated.reduce((s, c) => s + c.rating, 0) / rated.length).toFixed(1) : "-";
      const insts = [...new Set(list.map((c) => c.institution).filter(Boolean))];
      return `
      <article class="card" id="${esc(p.toLowerCase())}">
        <div class="chiprow"><span class="tag type">Provider</span><span class="provider">${list.length} course${list.length === 1 ? "" : "s"}</span></div>
        <h3><a href="index.html?provider=${encodeURIComponent(p)}">${esc(p)}</a></h3>
        ${insts.length ? `<div class="inst">${insts.map(esc).join(" · ")}</div>` : ""}
        <div class="meta">
          <span class="rating"><span class="star">&#9733;</span> ${avg} <span class="muted">avg</span></span>
          <span>${list.filter((c) => c.free).length} free</span>
          <span>${list.filter((c) => c.certificate).length} with certificate</span>
        </div>
        <div class="mini">${list.slice(0, 4).map((c) => `<a href="course.html?id=${encodeURIComponent(c.id)}">${esc(c.title)}<small>${esc(c.level)} · ${esc(duration(c))}${c.rating != null ? ` · ★ ${c.rating.toFixed(1)} (${num(c.numRatings)})` : ""}</small></a>`).join("")}</div>
        <div class="actions"><a class="btn primary sm" href="index.html?provider=${encodeURIComponent(p)}">See all on ${esc(p)}</a></div>
      </article>`;
    }).join("");
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView({ block: "start" });
  </script>
</body>
</html>
