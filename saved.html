<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saved · UPSY Courses</title>
  <link rel="icon" href="upsy_logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html"><img src="upsy_logo.jpeg" alt="UPSY" /><span>UPSY</span><small>Courses</small></a>
      <nav class="nav">
        <a class="topic" href="index.html#search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Try a new topic</span><kbd>Ctrl+K</kbd></a>
        <a href="saved.html">Saved<span class="pill" data-saved-count hidden>0</span></a>
      </nav>
    </div>
  </header>

  <div class="container page-title"><h1>Saved courses</h1><p>Kept in this browser. Tap the bookmark on any course to add or remove it.</p></div>
  <main class="container" style="padding-bottom:60px"><div class="list" id="list"></div></main>

  <script type="module">
    import { loadData, courseCard, wireSaveButtons, savedIds, markNav } from "./app.js";
    const db = await loadData();
    markNav();
    const list = document.getElementById("list");
    function render() {
      const items = savedIds().map((id) => db.courses.find((c) => c.id === id)).filter(Boolean);
      list.innerHTML = items.length ? items.map((c, i) => courseCard(c, i)).join("") : `<div class="empty">Nothing saved yet. <a href="index.html" style="color:var(--primary);font-weight:700">Find a course</a> and tap the bookmark.</div>`;
      wireSaveButtons(list);
      list.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", () => setTimeout(render, 150)));
    }
    render();
  </script>
</body>
</html>
